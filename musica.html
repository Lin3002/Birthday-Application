<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo de Música | K's Spooky Birthday</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Syne + Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020005;
            color: #f3e8ff;
            font-family: 'Syne', sans-serif;
            overflow-x: hidden;
            perspective: 1200px;
        }

        .font-code {
            font-family: 'Fira Code', monospace;
        }

        /* Luces cibernéticas de fondo */
        .cyber-glow {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.18) 0%, rgba(34, 197, 94, 0.06) 50%, transparent 80%);
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        /* Tarjeta holográfica */
        .holo-card {
            background: rgba(10, 5, 20, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 35px rgba(147, 51, 234, 0.2), inset 0 0 15px rgba(74, 222, 128, 0.05);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
        }

        /* Giro fluido y constante del vinilo grande */
        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .vinyl-spin {
            animation: spinVinyl 3.5s linear infinite;
        }

        /* Animación de flotación y balanceo dinámico para el tocadiscos */
        @keyframes turntableFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        .turntable-container {
            animation: turntableFloat 5s ease-in-out infinite;
        }

        /* Arañitas de fondo */
        @keyframes cyberCrawl {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(50vh) rotate(15deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(-15deg); opacity: 0.3; }
        }
        .spider {
            position: fixed;
            top: -50px;
            font-size: 20px;
            animation: cyberCrawl linear infinite;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative p-6">

    <!-- Fondo de luces -->
    <div class="cyber-glow" style="top: 10%; left: 15%;"></div>
    <div class="cyber-glow" style="bottom: 10%; right: 15%;"></div>

    <!-- Arañitas de fondo -->
    <div class="spider" style="left: 10%; animation-duration: 10s;">🕷️</div>
    <div class="spider" style="left: 85%; animation-duration: 12s; animation-delay: 2s;">🕷️</div>

    <!-- Botón para regresar al inicio -->
    <div class="z-20">
        <a href="index.html" class="inline-flex items-center gap-2 holo-card px-4 py-2 rounded-xl text-xs font-code text-purple-200 transition hover:border-purple-400">
            ← // root_directory
        </a>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow flex flex-col items-center justify-center text-center z-20 my-8 px-4 max-w-2xl mx-auto w-full">
        
        <!-- Estado de sistema superior -->
        <div class="inline-flex items-center gap-2 holo-card px-4 py-1 rounded-full text-[11px] font-code text-green-400 mb-6 border border-green-500/30">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            AUDIO_STREAM_PROTOCOL::ACTIVE
        </div>

        <!-- TOCADISCOS ENORME Y EN MOVIMIENTO DINÁMICO -->
        <div class="turntable-container relative w-72 h-72 md:w-80 md:h-80 flex items-center justify-center mb-8 select-none">
            
            <!-- Brazo de lectura estilizado y grande -->
            <div class="absolute -top-4 right-2 w-20 h-32 border-r-4 border-b-4 border-purple-400/90 rounded-br-3xl z-30 pointer-events-none transform rotate-12 shadow-[0_0_20px_rgba(168,85,247,0.7)]"></div>
            
            <!-- Base de estudio acrílica principal (Más grande) -->
            <div class="absolute inset-0 rounded-[2.5rem] holo-card border-2 border-purple-500/50 shadow-[0_0_50px_rgba(147,51,234,0.3)]"></div>
            
            <!-- Vinilo Fotorrealista Gigante Giratorio -->
            <div class="vinyl-spin w-60 h-60 md:w-68 md:h-68 rounded-full bg-gradient-to-tr from-gray-950 via-black to-gray-900 border-2 border-purple-800/80 flex items-center justify-center relative shadow-[0_0_50px_rgba(0,0,0,0.9)]">
                <!-- Surcos de alta definición con reflejos -->
                <div class="absolute inset-3 rounded-full border border-purple-900/40 shadow-inner"></div>
                <div class="absolute inset-8 rounded-full border border-purple-900/30"></div>
                <div class="absolute inset-14 rounded-full border border-purple-900/20"></div>
                <div class="absolute inset-20 rounded-full border border-purple-900/10"></div>
                
                <!-- Etiqueta central metálica -->
                <div class="w-20 h-20 rounded-full bg-gradient-to-br from-purple-600 via-indigo-600 to-green-500 flex items-center justify-center shadow-2xl border-2 border-white/30">
                    <div class="w-6 h-6 rounded-full bg-black border-2 border-purple-400 flex items-center justify-center">
                        <div class="w-2 h-2 rounded-full bg-green-400 animate-ping"></div>
                    </div>
                </div>
            </div>
        </div>

        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-2 text-white uppercase">
            Tocadiscos <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-green-400">Spooky</span>
        </h1>
        <p class="text-xs md:text-sm text-purple-300/80 max-w-md mb-8 font-light">
            Inyecta tu frecuencia sonora a la playlist central de la medianoche.
        </p>

        <!-- FORMULARIO HOLOGRÁFICO -->
        <div class="holo-card p-6 rounded-2xl w-full mb-8 text-left shadow-2xl">
            <div class="flex flex-col gap-3">
                <div>
                    <label class="block text-[10px] font-code uppercase tracking-wider text-purple-300 mb-1">// Input_Track_Data</label>
                    <input type="text" id="songInput" placeholder="Ej: Thriller - Michael Jackson" class="w-full bg-black/60 border border-purple-500/30 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-green-400 font-code shadow-inner transition-colors">
                </div>
                <button onclick="addSong()" class="w-full bg-gradient-to-r from-purple-600 to-green-600 hover:from-purple-500 hover:to-green-500 text-white font-semibold py-3 px-6 rounded-xl text-xs font-code uppercase tracking-wider transition transform hover:scale-[1.01] active:scale-[0.99] shadow-[0_0_25px_rgba(74,222,128,0.3)] cursor-pointer mt-2">
                    + Inyectar Canción
                </button>
            </div>
        </div>

        <!-- LISTA DE CANCIONES -->
        <div class="w-full text-left">
            <h3 class="text-[10px] font-code uppercase tracking-widest text-purple-400 mb-3">// Active_Playlist_Buffer</h3>
            <ul id="songList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <li class="holo-card p-3 rounded-xl text-xs text-purple-200 flex justify-between items-center font-code">
                    <span>🎵 Thriller - Michael Jackson</span>
                    <span class="text-[9px] text-green-400 bg-green-950/60 px-2 py-0.5 rounded border border-green-800/40">synced</span>
                </li>
            </ul>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs font-code text-purple-400/40 border-t border-purple-950/40 z-20">
        AUDIO_MODULE @ Keylin Martin • 2026
    </footer>

    <!-- SCRIPT DE INTERACTIVIDAD -->
    <script>
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.holo-card');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;

            cards.forEach(card => {
                card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });
        });

        function addSong() {
            const input = document.getElementById('songInput');
            const list = document.getElementById('songList');
            
            if(input.value.trim() !== "") {
                const li = document.createElement('li');
                li.className = "holo-card p-3 rounded-xl text-xs text-purple-200 flex justify-between items-center font-code animate-pulse";
                li.innerHTML = `<span>🎵 ${input.value}</span> <span class="text-[9px] text-green-400 bg-green-950/60 px-2 py-0.5 rounded border border-green-800/40">queued</span>`;
                
                list.prepend(li);
                input.value = "";
            }
        }
    </script>
</body>
</html>
